name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check

  firmware:
    name: Build firmware
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned toolchain
        working-directory: firmware
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware
      - name: Build firmware
        working-directory: firmware
        run: cargo build --release

  cinectl-linux:
    name: Build cinectl (Linux)
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux dependencies
        run: apt-get update && apt-get install -y pkg-config libudev-dev
      - name: Install pinned toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build cinectl
        run: cargo build -p cinectl --release

  cinectl-macos:
    name: Build cinectl (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build cinectl
        run: cargo build -p cinectl --release

  package:
    name: Build .deb/.rpm packages
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y pkg-config libudev-dev jq \
            debhelper dpkg-dev fakeroot rpm
      - name: Install pinned toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build .deb package
        run: |
          bash cinectl/packaging/gen-debian-metadata.sh
          (cd cinectl/packaging && dpkg-buildpackage -us -uc -b)
          mkdir -p dist
          mv cinectl/cinectl_*.deb dist/
      - name: Build .rpm package
        run: |
          source cinectl/packaging/cargo-metadata.sh
          mkdir -p "$HOME/rpmbuild"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          rpmbuild -bb \
            --define "version $VERSION" \
            --define "summary $DESCRIPTION" \
            --define "description $DESCRIPTION" \
            --define "workspace_dir $PWD" \
            --define "changelog_date $(date '+%a %b %d %Y')" \
            cinectl/packaging/cinectl.spec
          mkdir -p dist
          find "$HOME/rpmbuild/RPMS" -name '*.rpm' -exec mv {} dist/ \;
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: cinectl-packages
          path: dist/*

  release:
    name: Publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: cinectl-packages
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.deb dist/*.rpm \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
