name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check

  firmware:
    name: Build firmware
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned toolchain
        working-directory: firmware
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware
      - name: Build firmware
        working-directory: firmware
        run: cargo build --release

  cinectl-linux:
    name: Build cinectl (Linux)
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux dependencies
        run: apt-get update && apt-get install -y pkg-config libudev-dev
      - name: Install pinned toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build cinectl
        run: cargo build -p cinectl --release

  cinectl-macos:
    name: Build cinectl (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build cinectl
        run: cargo build -p cinectl --release

  package:
    name: Build .deb/.rpm packages
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: apt-get update && apt-get install -y pkg-config libudev-dev
      - name: Install pinned toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install packaging tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Build cinectl
        run: cargo build --release -p cinectl
      - name: Strip binary
        run: strip -s target/release/cinectl
      - name: Build .deb package
        run: cargo deb -p cinectl --no-build
      - name: Build .rpm package
        run: cargo generate-rpm -p cinectl
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: cinectl-packages
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm

  release:
    name: Publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: cinectl-packages
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.deb dist/*.rpm \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
