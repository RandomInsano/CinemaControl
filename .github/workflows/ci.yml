name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Every job here runs in a container, where GitHub Actions defaults `run:`
# steps to `sh` rather than `bash` (e.g. dash on Debian, which lacks
# `source`), unlike on a bare runner. Force bash everywhere for consistency.
defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check

  firmware:
    name: Build firmware
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned toolchain
        working-directory: firmware
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware
      - name: Build firmware
        working-directory: firmware
        run: cargo build --release

  cinectl-linux:
    name: Build cinectl (Linux)
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      description: ${{ steps.metadata.outputs.description }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux dependencies
        run: apt-get update && apt-get install -y pkg-config libudev-dev jq
      - name: Install pinned toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build cinectl
        run: cargo build -p cinectl --release
      - name: Extract package metadata
        id: metadata
        run: |
          source cinectl/packaging/cargo-metadata.sh
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "description=$DESCRIPTION" >> "$GITHUB_OUTPUT"
      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: cinectl-linux-binary
          path: target/release/cinectl

  cinectl-macos:
    name: Build cinectl (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build cinectl
        run: cargo build -p cinectl --release

  package-deb:
    name: Build .deb package
    needs: cinectl-linux
    runs-on: ubuntu-latest
    container: ubuntu:latest
    steps:
      - uses: actions/checkout@v6
      - name: Download cinectl binary
        uses: actions/download-artifact@v7
        with:
          name: cinectl-linux-binary
          path: target/release
      - name: Restore executable bit
        run: chmod +x target/release/cinectl
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y build-essential libudev1 \
            debhelper dpkg-dev fakeroot
      - name: Build .deb package
        env:
          VERSION: ${{ needs.cinectl-linux.outputs.version }}
          DESCRIPTION: ${{ needs.cinectl-linux.outputs.description }}
        run: |
          bash cinectl/packaging/gen-debian-metadata.sh
          (cd cinectl/packaging && dpkg-buildpackage -us -uc -b)
          mkdir -p dist
          mv cinectl/cinectl_*.deb dist/
      - name: Install .deb package
        run: apt-get install -y ./dist/*.deb
      - name: Verify cinectl --help
        run: cinectl --help
      - name: Verify cinectl list
        run: cinectl list
      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: cinectl-deb
          path: dist/*.deb

  package-rpm:
    name: Build .rpm package
    needs: cinectl-linux
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v6
      - name: Download cinectl binary
        uses: actions/download-artifact@v7
        with:
          name: cinectl-linux-binary
          path: target/release
      - name: Restore executable bit
        run: chmod +x target/release/cinectl
      - name: Install build dependencies
        run: dnf install -y rpm-build binutils
      - name: Build .rpm package
        env:
          VERSION: ${{ needs.cinectl-linux.outputs.version }}
          DESCRIPTION: ${{ needs.cinectl-linux.outputs.description }}
        run: |
          mkdir -p "$HOME/rpmbuild"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          rpmbuild -bb \
            --define "version $VERSION" \
            --define "summary $DESCRIPTION" \
            --define "pkg_description $DESCRIPTION" \
            --define "workspace_dir $PWD" \
            --define "changelog_date $(date '+%a %b %d %Y')" \
            cinectl/packaging/cinectl.spec
          mkdir -p dist
          find "$HOME/rpmbuild/RPMS" -name '*.rpm' -exec mv {} dist/ \;
      - name: Install .rpm package
        run: dnf install -y --nogpgcheck ./dist/*.rpm
      - name: Verify cinectl --help
        run: cinectl --help
      - name: Verify cinectl list
        run: cinectl list
      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: cinectl-rpm
          path: dist/*.rpm

  release:
    name: Publish release
    needs: [package-deb, package-rpm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download .deb package
        uses: actions/download-artifact@v7
        with:
          name: cinectl-deb
          path: dist
      - name: Download .rpm package
        uses: actions/download-artifact@v7
        with:
          name: cinectl-rpm
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.deb dist/*.rpm \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
