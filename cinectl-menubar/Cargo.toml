[package]
name = "cinectl-menubar"
version = "0.1.0"
edition = "2024"
description = "macOS menu bar companion for CinemaControl boards."
license = "MIT"

[dependencies]
anyhow = "1.0.104"
board-hid = { path = "../board-hid" }
hidapi = { version = "2.6.7", features = ["macos-shared-device"] }
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-service-management = "0.3.2"
protocol = { version = "0.1.0", path = "../protocol" }
tao = "0.37.0"
tray-icon = "0.24.2"
