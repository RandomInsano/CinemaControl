[package]
name = "cinectl"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
hidapi = "2.6.6"
protocol = { path = "../protocol" }

[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2.6.6", features = ["macos-shared-device"] }
