[package]
name = "cinectl"
version = "0.1.0"
edition = "2024"
description = "Host-side CLI for CinemaControl boards, talking to the firmware over USB HID."
license = "MIT"

[dependencies]
anyhow = "1.0.104"
argh = { version = "0.1.13", default-features = false, features = ["help"] }
board-hid = { path = "../board-hid" }
hidapi = "2.6.6"
protocol = { path = "../protocol" }

[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2.6.6", features = ["macos-shared-device"] }
