[package]
name = "CinemaControl"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Drive a WS2812 ("NeoPixel") on GPIO16 via PIO0 (see `neopixel.rs`): the
# RP2040-Zero's onboard LED, or an external one wired to GPIO16 on a Pico.
neopixel = []

[dependencies]
cortex-m = "0.7.9"
cortex-m-rt = "0.7.6"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
embassy-embedded-hal = "0.6.0"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
mcu-hal = { package = "embassy-rp", version = "0.10.0", features = ["rp2040", "time-driver", "critical-section-impl", "defmt"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
embassy-usb = { version = "0.6.0", default-features = false, features = ["defmt", "max-handler-count-4", "max-interface-count-4"] }
embedded-hal-async = "1.0.0"
emc1403 = { path = "emc1403" }
ina219 = { path = "ina219" }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
portable-atomic = { version = "1.15", features = ["critical-section"] }
protocol = { path = "../protocol" }
sequential-storage = { version = "8.0.1", features = ["defmt"] }
smart-leds = "0.4"
static_cell = "2.1.1"
