[workspace]
resolver = "2"
members = [
    "firmware",
    "cinectl",
    "cinectl-menubar",
    "firmware/emc1403",
    "firmware/fan-control",
    "firmware/ina219",
    "protocol",
    "board-hid",
]
# `firmware` is `no_std`/`no_main` and only builds for `thumbv6m-none-eabi`
# (pinned in `firmware/.cargo/config.toml`), which only applies when cargo is
# invoked with `firmware/` as the working directory — cargo config discovery
# doesn't follow `-p`/`--workspace` across member directories. So a bare
# `cargo build`/`check`/`run` from the repo root defaults to `cinectl` (the
# host tool) instead of trying and failing to cross-build firmware. Always
# `cd firmware` for firmware commands; see `AGENTS.md`.
#
# `emc1403` and `ina219` are `firmware`'s SMBus drivers, standalone and
# host-buildable despite living under `firmware/` — each is generic over
# `embedded-hal-async`'s `I2c` trait rather than `firmware`'s own bus type,
# so they're plain default members alongside `cinectl` for host-side
# building/testing rather than being pulled in only as `firmware` deps.
#
# `fan-control` is the same story, generic over `embedded-fans-async`'s
# `Fan`/`RpmSense` traits instead of any of `firmware`'s own peripheral
# types.
#
# `cinectl-menubar` is macOS-only (it drives an NSStatusItem) and is left out
# of default-members for the same reason `firmware` is: a bare
# `cargo build`/`check` shouldn't try and fail to build it on Linux.
#
# `board-hid` is `cinectl`'s and `cinectl-menubar`'s shared host-side HID
# transport (board discovery, feature-report read/write) — cross-platform
# like `cinectl` itself, so it's a default member too.
default-members = [
    "cinectl",
    "firmware/emc1403",
    "firmware/fan-control",
    "firmware/ina219",
    "protocol",
    "board-hid",
]

# Cargo ignores [profile.*] in member manifests — these must live at the
# workspace root, and apply to every member. `no_std` requires
# panic="abort" regardless. `opt-level = 3` over the usual embedded default
# of "z"/"s": measured firmware flash usage is ~75KB of the RP2040's 2MB
# (see `memory.x`), so there's no size pressure to trade code speed for —
# optimizing for space here would be paying real CPU cycles for headroom
# nobody needs. The host binaries (`cinectl`, `cinectl-menubar`) get their
# own overrides below since they ship as plain executables with no debugger
# attached to their release builds, unlike `firmware`'s ELF (kept as
# `debug = true` there for probe-rs's on-panic backtraces). `panic`/`lto`
# can't be overridden per-package, but "abort" and LTO are both fine for
# host binaries too.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = true
panic = "abort"

[profile.dev]
panic = "abort"

[profile.release.package.cinectl]
opt-level = 3
debug = false
strip = true

[profile.release.package.cinectl-menubar]
opt-level = 3
debug = false
strip = true
