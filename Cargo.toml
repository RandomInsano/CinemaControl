[workspace]
resolver = "2"
members = ["firmware", "cinectl", "emc1403", "ina219", "protocol"]
# `firmware` is `no_std`/`no_main` and only builds for `thumbv6m-none-eabi`
# (pinned in `firmware/.cargo/config.toml`), which only applies when cargo is
# invoked with `firmware/` as the working directory — cargo config discovery
# doesn't follow `-p`/`--workspace` across member directories. So a bare
# `cargo build`/`check`/`run` from the repo root defaults to `cinectl` (the
# host tool) instead of trying and failing to cross-build firmware. Always
# `cd firmware` for firmware commands; see `AGENTS.md`.
#
# `emc1403` and `ina219` are standalone, host-buildable `no_std` driver
# crates — neither is a `firmware` dependency yet (see their own doc
# comments) — so they're plain default members alongside `cinectl`.
default-members = ["cinectl", "emc1403", "ina219", "protocol"]

# Cargo ignores [profile.*] in member manifests — these must live at the
# workspace root, and apply to every member. `firmware` needs the aggressive
# size/panic settings (flash is tight, and `no_std` requires panic="abort"
# regardless); `cinectl` gets its own opt-level override below since it has
# no flash budget to optimize for. `panic`/`lto` can't be overridden
# per-package, but "abort" and LTO are both fine for a small CLI tool too.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = true
panic = "abort"

[profile.dev]
panic = "abort"

[profile.release.package.cinectl]
opt-level = 3
