[package]
name = "CinemaControl"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.9", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.6"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
embassy-embedded-hal = "0.6.0"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32f103c8", "time-driver-any", "defmt"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
embassy-usb = { version = "0.6.0", default-features = false, features = ["defmt", "max-handler-count-2", "max-interface-count-2"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
sequential-storage = { version = "8.0.1", features = ["defmt"] }
static_cell = "2.1.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = true
panic = "abort"

[profile.dev]
panic = "abort"
